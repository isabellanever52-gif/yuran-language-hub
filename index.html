*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:16px/1.65 Anuphan,"Noto Sans Thai","Sarabun","Leelawadee UI",Tahoma,system-ui,sans-serif;min-height:100vh;background:radial-gradient(circle at 12% 18%,var(--blob1),transparent 42%),radial-gradient(circle at 88% 72%,var(--blob2),transparent 40%),linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg1)) fixed;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--pattern);background-size:var(--psize)}
h1,h2,h3,button,.brand,.sub,nav button,.lbtn,.fxb{font-family:Prompt,Anuphan,"Noto Sans Thai",sans-serif}
header{background:radial-gradient(var(--hdot) 2px,transparent 2.6px) 0 0/14px 14px,linear-gradient(135deg,var(--h1),var(--h2));color:var(--htxt);padding:14px 14px 8px;border-bottom:4px solid #fff;border-radius:0 0 30px 30px;box-shadow:0 6px 0 var(--sh)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.brand{font:italic 600 27px/1.2 "Playfair Display","Noto Serif KR",serif;text-shadow:2px 2px 0 var(--brandsh);letter-spacing:.01em}
.brand .flag{height:1.1em;width:auto;margin-left:.3em;vertical-align:-.2em;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.2))}
.sub{font-weight:500;font-size:13px;opacity:.95;margin:2px 0 4px}
#fxbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0 2px}
.fxb{min-width:36px;height:36px;border-radius:999px;border:3px solid #fff;background:rgba(255,255,255,.28);color:var(--htxt);font-size:16px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--navsh);padding:0 8px}
.fxb.txt{font-weight:700;font-size:12.5px;padding:0 12px}
.fxb[aria-pressed="false"]{opacity:.55;filter:grayscale(1)}
.sws{display:flex;gap:7px;margin-left:4px}.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 0 var(--navsh);padding:0}
.sw[aria-pressed="true"]{transform:scale(1.18);outline:3px solid var(--htxt);outline-offset:1px}
nav{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:8px 2px 12px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-weight:600;font-size:14.5px;color:var(--navtxt);background:var(--navbg);border:3px solid var(--navbg);border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 4px 0 var(--navsh);white-space:nowrap;transition:transform .15s}
nav button.on{background:var(--navstripe);color:var(--navon);transform:translateY(-2px) scale(1.05);box-shadow:0 6px 0 var(--navsh)}
nav button[data-k=tr]::before{content:"💬 "}nav button[data-k=dc]::before{content:"📖 "}nav button[data-k=gr]::before{content:"🎀 "}nav button[data-k=cv]::before{content:"✨ "}nav button[data-k=ar]::before{content:"🗂️ "}nav button[data-k=st]::before{content:"⚙️ "}
main{max-width:860px;margin:0 auto;padding:30px 14px 40px}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:26px;box-shadow:5px 6px 0 var(--sh)}
.card>h2:first-child{display:inline-block;margin:-34px 0 10px;padding:3px 18px;font-weight:700;font-size:17px;color:var(--navyon);background:var(--navy);border:3px solid #fff;border-radius:999px;box-shadow:2px 3px 0 var(--sh)}
.card>h2:first-child small{font-weight:500;opacity:.9;color:inherit}
h2{margin:4px 0 12px;font-weight:700;font-size:19px}h3{margin:0 0 6px;font-weight:700;font-size:16px;color:var(--navy)}h3::before{content:"✿ ";font-size:.9em}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2.5px solid var(--line);border-radius:16px;background:var(--pale);color:var(--ink);transition:box-shadow .15s,border-color .15s}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px var(--focus)}
input[type=checkbox]{accent-color:var(--navy);width:auto}
button.b,.lbtn{font-weight:700;font-size:15px;color:var(--on);background:repeating-linear-gradient(135deg,var(--btn1) 0 10px,var(--btn2) 10px 20px);border:3px solid #fff;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 0 0 2px var(--navy),0 5px 0 2px var(--btnsh);transition:transform .12s,box-shadow .12s;display:inline-block;margin:0}
button.b:hover,.lbtn:hover{transform:translateY(-2px)}
button.b:active,.lbtn:active{transform:translateY(4px) scale(.96);box-shadow:0 0 0 2px var(--navy),0 1px 0 2px var(--btnsh)}
button.b.s{background:var(--card);color:var(--navy)}
button.b.d{background:var(--card);color:var(--bad);box-shadow:0 0 0 2px var(--bad),0 5px 0 2px var(--sh)}
button.b[disabled]{opacity:.5;filter:grayscale(.5);cursor:not-allowed;transform:none}
.bounce{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(1)}25%{transform:scale(.86,1.1)}55%{transform:scale(1.12,.9)}80%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.row>*{flex:0 0 auto}.grow{flex:1 1 140px!important}
:focus-visible{outline:3px solid #7c4dff;outline-offset:3px}
.yu{font-family:var(--yf,"Noto Serif KR",serif);font-size:1.15em}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;background:var(--pale);border:1.5px solid var(--line);color:var(--navy);margin-right:4px;font-weight:600}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.out{background:var(--cream);border:3px dashed var(--line);border-radius:18px;padding:12px;font-size:20px;min-height:54px;word-break:break-word}
.unk{background:#ffe08a;color:#5a3b00;border-radius:6px;padding:0 5px;font-size:.85em}
.item{display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:2px dashed var(--line);cursor:pointer;border-radius:14px;transition:background .15s,transform .12s}
.item:first-child{border-top:0}.item:hover{background:var(--pale)}.item:active{transform:scale(.98)}.item .t{flex:1;min-width:0}
.empty{text-align:center;color:var(--mut);padding:24px 8px;border:2px dashed var(--line);border-radius:18px;background:var(--pale)}.empty::before{content:"♡ ♡ ♡";display:block;color:var(--navy);margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}.tbl th{background:var(--pale);color:var(--navy)}.tbl td,.tbl th{border-bottom:2px dashed var(--line);padding:7px;text-align:left;vertical-align:top}
#modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 14px;z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.on{display:flex}#modal .card{width:100%;max-width:560px;margin:auto}
small,.note{color:var(--mut);font-size:13px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}.vh:focus-visible+.lbtn{outline:3px solid #7c4dff;outline-offset:3px}
/* ===== Liquid glass (พจนานุกรม) ===== */
.glass,.glass-list{position:relative;background:linear-gradient(135deg,var(--glass1),var(--glass2));backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7);border:1.5px solid var(--glassb);box-shadow:0 10px 34px var(--glassx),inset 0 1.5px 0 var(--glassb),inset 0 -1.5px 0 rgba(255,255,255,.12);overflow:hidden}
.glass::before,.glass-list::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 55% at 15% -8%,rgba(255,255,255,.6),transparent 55%),radial-gradient(60% 40% at 100% 100%,rgba(255,255,255,.18),transparent 70%);opacity:.8}
.glass>*,.glass-list>*{position:relative}
.glass>h2:first-child{margin-top:0}
.card.glass>h2:first-child,.card.glass-list>h2:first-child{margin-top:-8px}
.glass-list .item{border:1.5px solid var(--glassb);border-top:1.5px solid var(--glassb);border-radius:22px;margin:10px 0;padding:12px 14px;background:linear-gradient(135deg,var(--glass1),var(--glass2));box-shadow:0 6px 18px var(--glassx),inset 0 1.5px 0 var(--glassb);position:relative;overflow:hidden}
.glass-list .item::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 18% -20%,rgba(255,255,255,.65),transparent 58%)}
.glass-list .item>*{position:relative}
.glass-list .item:hover{transform:translateY(-2px) scale(1.01);background:linear-gradient(135deg,var(--glass1),var(--glass1))}
.glass .tbl td,.glass .tbl th{border-bottom:1.5px solid var(--glassb)}.glass .tbl th{background:transparent}
.glass-list .tag{background:rgba(255,255,255,.35);border-color:var(--glassb)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.glass-list{background:var(--card)}}
/* ===== balloons (smaller) ===== */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.balloon{position:absolute;bottom:-90px;width:var(--s);height:calc(var(--s)*1.22);pointer-events:auto;cursor:pointer;touch-action:manipulation;animation:rise var(--d) linear forwards}
.balloon i{position:absolute;inset:0;border-radius:50% 50% 47% 47%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.65) 0 11%,transparent 12%),var(--c);border:1.5px solid rgba(255,255,255,.7);box-shadow:inset -3px -4px 0 rgba(0,0,0,.1),0 2px 0 rgba(0,0,0,.08)}
.balloon::before{content:"";position:absolute;left:50%;top:99%;margin-left:-3px;border:3.5px solid transparent;border-bottom:5px solid var(--c);border-top:0}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:22px;background:var(--mut);opacity:.55;transform-origin:top;animation:sway 1.6s ease-in-out infinite alternate}
.balloon.pop i{animation:burst .2s ease-out forwards}.balloon.pop::before,.balloon.pop::after{display:none}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(12px,-32vh)}50%{transform:translate(-11px,-64vh)}75%{transform:translate(10px,-96vh)}100%{transform:translate(0,-135vh)}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes burst{0%{transform:scale(1);opacity:1}60%{transform:scale(1.6);opacity:.8}100%{transform:scale(2);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:31;font-size:18px;line-height:1;transition:transform .75s cubic-bezier(.2,.8,.3,1),opacity .75s;will-change:transform}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const b64=x=>{const u=typeof x==='string'?new TextEncoder().encode(x):new Uint8Array(x);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function ghPut(path,content,msg){let sha;try{sha=(await ghReq('GET',path)).sha}catch(e){if(e.status!==404)throw e}
 if(sha&&GH.sha[path]&&sha!==GH.sha[path]){const e=new Error('stale');e.stale=true;throw e}
 const r=await ghReq('PUT',path,{message:'Yuran Hub: '+msg,content:b64(content),branch:GHC().GITHUB_BRANCH||'main',...(sha?{sha}:{})});GH.sha[path]=r.content.sha}
function ghMsg(e){if(e&&e.stale)return 'ข้อมูลบนเว็บถูกแก้จากที่อื่นหลังจากโหลดหน้านี้ จึงไม่บันทึกทับ — รีเฟรชหน้าแล้วทำซ้ำ';const s=e&&e.status;
 return s===401?'โทเค็นไม่ถูกต้องหรือหมดอายุ':s===403?'โทเค็นไม่มีสิทธิ์เขียน (ต้องเป็น Contents: Read and write) หรือถูกจำกัดอัตรา':s===404?'ไม่พบที่เก็บหรือไฟล์ หรือโทเค็นไม่ได้รับสิทธิ์ที่เก็บนี้ (ตรวจ GITHUB_OWNER/GITHUB_REPO ในบล็อก YURAN_CONFIG ตอนต้นไฟล์ HTML)':s===409||s===422?'GitHub ปฏิเสธการบันทึก (ข้อมูลเปลี่ยนซ้อนกัน) — รีเฟรชแล้วลองใหม่':(e instanceof TypeError)?'เชื่อมต่อ GitHub ไม่ได้ (ตรวจอินเทอร์เน็ต)':(e&&e.message)||String(e)}
function queueSync(){if(MODE!=='admin'||!GH.ok||!GH.loaded)return;clearTimeout(GH.t);GH.t=setTimeout(ghPush,800)}
async function ghPush(){if(GH.busy){GH.t=setTimeout(ghPush,800);return}const ch=Object.keys(DATA_FILES).filter(k=>ser(k)!==GH.snap[k]);if(!ch.length)return;
 if(ch.includes('dict')){const old=GH.snap.dict?JSON.parse(GH.snap.dict).entries.length:0,nw=S.dict.length;if(nw<old-1&&!await ask('การบันทึกนี้จะลบคำศัพท์ '+(old-nw)+' คำออกจากเว็บ ('+old+' → '+nw+') ยืนยันหรือไม่? ประวัติใน GitHub ยังย้อนกลับได้')){GH.err='ยกเลิกการบันทึก — ข้อมูลบนเว็บยังไม่เปลี่ยน รีเฟรชหน้าเพื่อโหลดข้อมูลจริงกลับมา';render();return}}
 GH.busy=true;try{for(const k of ch){const body=ser(k);await ghPut(DATA_FILES[k],body,'update '+DATA_FILES[k]);GH.snap[k]=body}GH.err='';toast('บันทึกขึ้น GitHub แล้ว (ผู้ชมเห็นภายในประมาณ 1 นาที)')}
 catch(e){GH.err='บันทึกขึ้น GitHub ไม่สำเร็จ (ข้อมูลบนหน้านี้ยังไม่ถูกบันทึก): '+ghMsg(e);showErr(GH.err)}finally{GH.busy=false;render()}}
async function loadFontFile(){try{const r=await fetch('fonts/yuran.otf?v='+GH.fontv+(MODE==='admin'?'&t='+Date.now():''));if(!r.ok)throw new Error(r.status);const buf=await r.arrayBuffer(),face=new FontFace('YuranFile',buf.slice(0));await face.load();document.fonts.add(face);FF.ok=true;FF.buf=buf}catch(e){FF.ok=false}setFont()}
async function dataInit(){try{if(MODE==='admin')GH.token=sessionStorage.getItem('yuran-gh-token')||localStorage.getItem('yuran-gh-token')||'';
 if(MODE==='admin'&&GH.token&&GHC().GITHUB_OWNER){try{await ghLoadAll()}catch(e){GH.err='เข้าสู่ระบบอัตโนมัติไม่สำเร็จ: '+ghMsg(e);GH.token='';await pagesLoadAll()}}else await pagesLoadAll()}
 catch(e){GH.err='โหลดข้อมูลไม่สำเร็จ: '+(e.message||e)}await loadFontFile()}
